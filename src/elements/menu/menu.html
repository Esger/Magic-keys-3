<template class="hamburger">
    <require from="./menu.css"></require>
    <i class="fa fa-bars"
    class.bind="menuDisabled ? 'disabled' : ''"
    mouseenter.trigger="showTheMenu($event)"
    touchstart.trigger="showTheMenu($event)"></i>

    <ul class="menu"
        if.bind="settings.menuVisible">

        <li click.delegate="hideTheMenu()"
            touchstart.trigger="hideTheMenu()">
            <i class="fa fa-times"></i>
        </li>

        <li mouseenter.trigger="toggleSubmenuLanguage()"
            mouseleave.trigger="toggleSubmenuLanguage()"
            touchstart.trigger="toggleSubmenuLanguage()">
            Language&nbsp;<i class="fa fa-angle-right"></i>
            <ul if.bind="settings.submenuLanguageVisible"
                class="subMenu">
                <li class="${settings.currentLanguage == 'en' ? 'active' : ''}"
                    click.delegate="setLanguage('en')"
                    touchstart.trigger="setLanguage('en')">English</li>
                <li class="${settings.currentLanguage == 'nl' ? 'active' : ''}"
                    click.delegate="setLanguage('nl')"
                    touchstart.trigger="setLanguage('nl')">Dutch</li>
            </ul>
        </li>

        <li mouseenter.trigger="toggleSubmenuBoards()"
            mouseleave.trigger="toggleSubmenuBoards()"
            touchstart.trigger="toggleSubmenuBoards()">
            Keyboards&nbsp;<i class="fa fa-angle-right"></i>
            <ul if.bind="settings.submenuBoardsVisible"
                class="subMenu">
                <li if.bind="isMobile"
                    repeat.for="boardType of boardTypes.mobile"
                    class="${boardType.keyAmount == settings.currentBoardType ? 'active' : ''}"
                    click.delegate="setKeyAmount(boardType.keyAmount, $event)"
                    touchstart.trigger="setKeyAmount(boardType.keyAmount, $event)">${boardType.name}</li>
                <li else
                    repeat.for="boardType of boardTypes.desktop"
                    class="${boardType.keyAmount == settings.currentBoardType ? 'active' : ''}"
                    click.delegate="setKeyAmount(boardType.keyAmount, $event)"
                    touchstart.trigger="setKeyAmount(boardType.keyAmount, $event)">${boardType.name}</li>
            </ul>
        </li>

        <li mouseenter.trigger="toggleSubmenuDepth()"
            mouseleave.trigger="toggleSubmenuDepth()"
            touchend.trigger="toggleSubmenuDepth()">
            Learning&nbsp;<i class="fa fa-angle-right"></i>
            <ul if.bind="settings.submenuDepthVisible"
                class="subMenu">
                <li repeat.for="depth of depths"
                    class="${depth == settings.currentDepth ? 'active' : ''}"
                    click.delegate="setDepth(depth)"
                    touchstart.trigger="setDepth(depth)">Depth: ${depth}</li>
            </ul>
        </li>

        <li click.delegate="resetData()">Reset to default knowledge</li>

        <li click.delegate="cleanData()">Clean all knowledge</li>

    </ul>

</template>
