<template>
    <require from="elements/menu/menu"></require>
    <require from="./header.css"></require>

    <div class="swipe-switch ${swipeEnabled ? 'active' : ''}"

        <span class="text">Swipe</span>

    <h1 click.delegate="clear()">${message}</h1>

    <menu></menu>
